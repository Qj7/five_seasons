# Publish Vite build to the main branch root for Pages.
# Local dev always restores index.html from index.template.html.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify production build
        run: |
          test -f dist/index.html
          grep -q '/magic_shoes/assets/' dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html
          test -d dist/products
          test -d dist/assets

      - name: Publish build to branch root
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -r dist/assets assets
          touch .nojekyll

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets .nojekyll
          if git diff --staged --quiet; then
            echo "No site changes to publish"
            exit 0
          fi
          git commit -m "deploy: publish production build to Pages"
          git push
